<svg xmlns="http://www.w3.org/2000/svg" width="858" height="264" viewBox="0 0 858 264" role="img"><title>N17-name-empty: every block of the archive</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px;fill:#1f2328}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#59636e}.accent{fill:#bc4c00;font-weight:600}.small{font-size:10px;text-anchor:middle;fill:#59636e}.field{fill:#ffffff;stroke:#59636e;stroke-width:0.75}.nul{fill:#ffffff}.text{fill:#54aeff}.space{fill:#b6e3ff}.control{fill:#fb8f44}.high{fill:#c297ff}.explicit{fill:none;stroke:#bc4c00;stroke-width:2}</style><rect width="100%" height="100%" fill="#ffffff"/><text class="mono" x="4" y="17">0x000000</text><text x="76" y="17">header: regular file</text><g><title>name [0,100): 100 NUL</title><rect class="field" x="76" y="22" width="150" height="18"/></g><text class="small" x="151" y="51">name</text><g><title>mode [100,108): &quot;0000644&quot; + NUL, 644 (octal)</title><rect class="field" x="226" y="22" width="12" height="18"/><rect class="text" x="226" y="22" width="10.5" height="18"/></g><g><title>uid [108,116): &quot;0000000&quot; + NUL, 0</title><rect class="field" x="238" y="22" width="12" height="18"/><rect class="text" x="238" y="22" width="10.5" height="18"/></g><g><title>gid [116,124): &quot;0000000&quot; + NUL, 0</title><rect class="field" x="250" y="22" width="12" height="18"/><rect class="text" x="250" y="22" width="10.5" height="18"/></g><g><title>size [124,136): &quot;00000000010&quot; + NUL, 8</title><rect class="field" x="262" y="22" width="18" height="18"/><rect class="text" x="262" y="22" width="16.5" height="18"/></g><g><title>mtime [136,148): &quot;00000000000&quot; + NUL, 0</title><rect class="field" x="280" y="22" width="18" height="18"/><rect class="text" x="280" y="22" width="16.5" height="18"/></g><g><title>chksum [148,156): &quot;007176\0 &quot;, 3710: the unsigned sum of the head