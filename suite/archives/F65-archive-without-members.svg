<svg xmlns="http://www.w3.org/2000/svg" class="blocks" width="858" height="144" viewBox="0 0 858 144" role="img"><title>F65-archive-without-members: every block of the archive</title><style>.blocks{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px;fill:#1f2328}.blocks-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#59636e}.blocks-accent{fill:#bc4c00;font-weight:600}.blocks-small{font-size:10px;text-anchor:middle;fill:#59636e}.blocks-field{fill:#ffffff;stroke:#59636e;stroke-width:0.75}.blocks-nul{fill:#ffffff}.blocks-text{fill:#54aeff}.blocks-space{fill:#b6e3ff}.blocks-control{fill:#fb8f44}.blocks-high{fill:#c297ff}.blocks-explicit{fill:none;stroke:#bc4c00;stroke-width:2}</style><rect width="100%" height="100%" fill="#ffffff"/><text class="blocks-mono" x="4" y="17">0x000000</text><text x="76" y="17">2 zero blocks: the end-of-archive marker</text><g><title>bytes 0 to 512 of 1024: 512 NUL</title><rect class="blocks-field" x="76" y="22" width="768" height="18"/></g><text class="blocks-mono" x="4" y="65">0x000200</text><text x="76" y="65">2 zero blocks, continued</text><g><title>bytes 512 to 1024 of 1024: 512 NUL</title><rect class="blocks-field" x="76" y="70" width="768" height="18"/></g><text class="blocks-mono" x="4" y="113">0x000400</text><text x="76" y="113">end of file</text><rect class="blocks-field blocks-nul" x="76" y="126" width="12" height="12"/><text x="92" y="136">NUL</text><rect class="blocks-field blocks-text" x="124" y="126" width="12" height="12"/><text x="140" y="136">printable ASCII</text><rect class="blocks-field blocks-space" x="244" y="126" width="12" height="12"/><text x="260" y="136">space</text><rect class="blocks-field blocks-control" x="304" y="126" width="12" height="12"/><text x="320" y="136">control character, such as a newline</text><rect class="blocks-field blocks-high" x="550" y="126" width="12" height="12"/><text x="566" y="136">byte over 0x7f</text><rect class="blocks-field blocks-explicit" x="664" y="126" width="12" height="12"/><text x="680" y="136">written by the case itself</text></svg>
